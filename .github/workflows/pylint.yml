name: Pylint

on:
  push:
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
      - run: pip install -r requirements.txt pylint
      - run: >
          pylint --source-roots=.
          --disable=C,R,W0621,W0640,W0123,W0718
          --exit-zero --fail-on=E
          endfield_*.py lib tests
